    Publications:
      - title: "CaRF: Camera-Aware Cross-View Alignment for Referring 3D Gaussian Splatting Segmentation"
        authors:
          - Yuwen Tao
          - Kanglei Zhou
          - Xin Tan
          - Yuan Xie
        publisher: ICME 2026 (Oral, Top 5%)
        releaseDate: 2026
        url: https://arxiv.org/abs/2511.03992
        summary: Teaches a 3D-Gaussian segmentation model with paired views and camera poses, improving mIoU on Ref-LERF from 25.0 to 29.2 (+16.8% relative) over ReferSplat.

      - title: "Geometry-Aware Cross-Modal Graph Alignment for Referring Segmentation in 3D Gaussian Splatting"
        authors:
          - Yuwen Tao
          - Kanglei Zhou
          - Chang Li
          - Liyuan Wang
        publisher: CVPR 2026 (Poster)
        releaseDate: 2026-06-06
        url: https://cvpr.thecvf.com/virtual/2026/poster/38204
        summary: "Combines semantic–spatial graphs derived from text with geometric graphs built from 3D Gaussian Splatting representations to improve referring segmentation accuracy via cross-modal alignment. mIoU improvements: +28.8% on Ref-LERF, +2.6% on LERF-OVS, +3.1% on 3D-OVS."

